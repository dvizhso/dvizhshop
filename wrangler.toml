name = "dvizh-shop"
main = "worker/src/index.mjs"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

# Cloudflare создаст D1 и R2 автоматически при деплое через кнопку.
[[d1_databases]]
binding = "DB"
database_name = "dvizh-shop-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dvizh-shop-photos"

[vars]
SITE_URL = "https://dvizhso.github.io/dvizhshop"

# Каждые 5 минут Worker добивает уведомления, которые не ушли сразу.
[triggers]
crons = ["*/5 * * * *"]
